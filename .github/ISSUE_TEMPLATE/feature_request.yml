name: Feature request
description: Something that would make reading or tracking books better
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do and what gets in the way today
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: The solution you would like
    validations:
      required: true
